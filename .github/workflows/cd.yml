name: Continuous Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_binaries:
        description: "Deploy Go CLI binaries to GitHub Releases"
        type: boolean
        required: true
        default: true
      deploy_ecr:
        description: "Build & push Lambda Docker image to Amazon ECR"
        type: boolean
        required: true
        default: true
      custom_version:
        description: "Custom SemVer version tag (e.g. v1.1.0). Leave blank to auto-derive from Git SHA."
        type: string
        required: false
        default: ""
      is_test_image:
        description: "Mark as test deployment (tags ECR image with test-<branch>-<sha>)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write    # Required for creating Git releases & tags
  id-token: write    # Required for requesting AWS OIDC JWT tokens
  packages: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Pre-Flight Quality Gate
  # -------------------------------------------------------------------------
  preflight-check:
    name: Pre-Flight Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

      - name: Run Unit Tests & Quality Suite
        run: |
          make vet
          make test-ci

  # -------------------------------------------------------------------------
  # Job 2: Resolve Release Metadata & Dynamic Tagging
  # -------------------------------------------------------------------------
  resolve-metadata:
    name: Resolve Release Metadata
    needs: [preflight-check]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      is_test: ${{ steps.meta.outputs.is_test }}
      ecr_tags: ${{ steps.meta.outputs.ecr_tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version & Tags
        id: meta
        run: ./.github/scripts/resolve-metadata.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          IS_TEST_IMAGE: ${{ inputs.is_test_image }}

  # -------------------------------------------------------------------------
  # Job 3: Publish Standalone Go Binaries to GitHub Releases
  # -------------------------------------------------------------------------
  publish-go-binaries:
    name: Publish Go Binaries
    needs: [preflight-check, resolve-metadata]
    if: |
      always() &&
      needs.preflight-check.result == 'success' &&
      needs.resolve-metadata.result == 'success' &&
      (github.event_name == 'push' || inputs.deploy_binaries == true) &&
      needs.resolve-metadata.outputs.is_test == 'false'
    uses: ./.github/workflows/reusable-publish-go.yml
    with:
      version: ${{ needs.resolve-metadata.outputs.version }}
      binary_name: "data-loader"
      go_version: "1.26"
      draft: false
      prerelease: false

  # -------------------------------------------------------------------------
  # Job 4: Build & Deploy Lambda Docker Image to Amazon ECR & AWS Lambda
  # -------------------------------------------------------------------------
  deploy-ecr-image:
    name: Deploy to Amazon ECR & AWS Lambda
    needs: [preflight-check, resolve-metadata]
    if: |
      always() &&
      needs.preflight-check.result == 'success' &&
      needs.resolve-metadata.result == 'success' &&
      (github.event_name == 'push' || inputs.deploy_ecr == true)
    uses: ./.github/workflows/reusable-deploy-ecr.yml
    with:
      ecr_repository: ${{ vars.ECR_REPOSITORY_NAME || 'ajp/babylon' }}
      image_tags: ${{ needs.resolve-metadata.outputs.ecr_tags }}
      dockerfile: "Dockerfile.lambda"
      platforms: "linux/arm64"
      aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
      role_to_assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      role_session_name: "GitHubActions-DataLoader-CD"
      update_lambda: ${{ needs.resolve-metadata.outputs.is_test == 'false' }}
      lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME || 'babylon-data-loader' }}
      lambda_deploy_tag: "data-loader-sha-${{ needs.resolve-metadata.outputs.short_sha }}"
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
