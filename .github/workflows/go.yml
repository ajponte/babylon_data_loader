# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    # The official action handles installation of the latest version of golangci-lint
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.9.0

    - name: Run make build
      run: make build

    - name: Run make test
      run: make test-ci

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Run make test-integration
      env:
        MONGO_IT_URI: mongodb://localhost:27017
      run: make test-integration

  desktop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Linux GUI Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Build and Test Desktop Frontend
      working-directory: desktop/frontend
      run: |
        npm ci
        npm run build
        npm test

    - name: Vet and Test Desktop Go Module
      working-directory: desktop
      run: |
        go vet -tags webkit2_41 ./...
        go test -tags webkit2_41 -race ./...
